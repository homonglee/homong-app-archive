<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Homong's App Archive 소개</title>
  <desc id="desc">아이디어를 앱으로 만들고 한곳에서 찾아 바로 실행하는 인터랙티브 앱 아카이브</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10112b"/><stop offset=".48" stop-color="#0b1530"/><stop offset="1" stop-color="#06121f"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b6cff"/><stop offset="1" stop-color="#27d8f3"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".055"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#835cff" stop-opacity=".58"/><stop offset="1" stop-color="#835cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#23d5ef" stop-opacity=".42"/><stop offset="1" stop-color="#23d5ef" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000818" flood-opacity=".48"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1600" height="900" rx="54" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="54" fill="url(#grid)"/>
  <circle cx="210" cy="120" r="420" fill="url(#glowA)"/>
  <circle cx="1430" cy="700" r="480" fill="url(#glowB)"/>
  <path d="M0 748C295 650 470 820 768 716s502-26 832 58v126H0Z" fill="#111933" fill-opacity=".42"/>

  <g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <g transform="translate(108 112)">
      <rect width="392" height="58" rx="29" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".2"/>
      <circle cx="31" cy="29" r="15" fill="url(#brand)"/>
      <path d="M24 29h14M31 22v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="39" fill="#dfe7ff" font-size="23" font-weight="800" letter-spacing="2">HOMONG'S APP ARCHIVE</text>
    </g>

    <text x="105" y="310" fill="#ffffff" font-size="91" font-weight="900" letter-spacing="-5">아이디어를 앱으로,</text>
    <text x="105" y="420" fill="url(#brand)" font-size="91" font-weight="900" letter-spacing="-5">한곳에서 바로 실행</text>
    <text x="110" y="505" fill="#b9c2da" font-size="31" font-weight="600" letter-spacing="-1">만든 앱을 빠르게 찾고 클릭 한 번으로 실행하는 인터랙티브 아카이브</text>

    <g transform="translate(106 575)" font-size="24" font-weight="800">
      <g><rect width="142" height="58" rx="29" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".18"/><text x="34" y="38" fill="#f3f6ff">⌕ 검색</text></g>
      <g transform="translate(158)"><rect width="142" height="58" rx="29" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".18"/><text x="31" y="38" fill="#f3f6ff">◇ 필터</text></g>
      <g transform="translate(316)"><rect width="142" height="58" rx="29" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".18"/><text x="31" y="38" fill="#f3f6ff">↕ 정렬</text></g>
      <g transform="translate(474)"><rect width="190" height="58" rx="29" fill="url(#brand)"/><text x="31" y="38" fill="#fff">▶ 바로 실행</text></g>
    </g>
  </g>

  <g transform="translate(1000 92)" filter="url(#shadow)">
    <rect width="490" height="680" rx="42" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <rect x="26" y="28" width="438" height="58" rx="18" fill="#071024" fill-opacity=".72"/>
    <circle cx="58" cy="57" r="8" fill="#ff6d91"/><circle cx="84" cy="57" r="8" fill="#ffd166"/><circle cx="110" cy="57" r="8" fill="#52e0b6"/>
    <rect x="143" y="45" width="212" height="24" rx="12" fill="#ffffff" fill-opacity=".09"/>

    <g transform="translate(32 118)">
      <g><rect width="202" height="218" rx="30" fill="#111c3b" stroke="#9a74ff" stroke-opacity=".46"/><rect x="24" y="24" width="72" height="72" rx="22" fill="#8b5cf6"/><path d="M48 49h24v24H48zM55 42v38M41 61h38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="24" y="124" width="132" height="17" rx="8" fill="#fff" fill-opacity=".86"/><rect x="24" y="154" width="158" height="12" rx="6" fill="#fff" fill-opacity=".18"/><rect x="24" y="179" width="104" height="12" rx="6" fill="#fff" fill-opacity=".1"/></g>
      <g transform="translate(220)"><rect width="202" height="218" rx="30" fill="#0c2537" stroke="#31d7ed" stroke-opacity=".45"/><rect x="24" y="24" width="72" height="72" rx="22" fill="#20c7e5"/><path d="M47 47h26v26H47zM42 60h36M60 42v36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="24" y="124" width="120" height="17" rx="8" fill="#fff" fill-opacity=".86"/><rect x="24" y="154" width="154" height="12" rx="6" fill="#fff" fill-opacity=".18"/><rect x="24" y="179" width="90" height="12" rx="6" fill="#fff" fill-opacity=".1"/></g>
      <g transform="translate(0 236)"><rect width="202" height="218" rx="30" fill="#152038" stroke="#ffffff" stroke-opacity=".15"/><rect x="24" y="24" width="72" height="72" rx="22" fill="#f06aa8"/><circle cx="60" cy="60" r="22" fill="none" stroke="#fff" stroke-width="4"/><path d="M60 48v14l10 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="24" y="124" width="146" height="17" rx="8" fill="#fff" fill-opacity=".86"/><rect x="24" y="154" width="158" height="12" rx="6" fill="#fff" fill-opacity=".18"/><rect x="24" y="179" width="116" height="12" rx="6" fill="#fff" fill-opacity=".1"/></g>
      <g transform="translate(220 236)"><rect width="202" height="218" rx="30" fill="#171d39" stroke="#ffffff" stroke-opacity=".15"/><rect x="24" y="24" width="72" height="72" rx="22" fill="#f3a64c"/><path d="M43 48h34v26H43zM49 42v12M71 42v12M49 80h22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="24" y="124" width="126" height="17" rx="8" fill="#fff" fill-opacity=".86"/><rect x="24" y="154" width="151" height="12" rx="6" fill="#fff" fill-opacity=".18"/><rect x="24" y="179" width="95" height="12" rx="6" fill="#fff" fill-opacity=".1"/></g>
    </g>

    <rect x="32" y="598" width="426" height="52" rx="26" fill="url(#brand)"/>
    <circle cx="67" cy="624" r="13" fill="#fff" fill-opacity=".9"/>
    <path d="M62 624l4 4 8-9" fill="none" stroke="#6553d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="633" fill="#fff" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="850">앱을 선택하고 바로 시작하세요</text>
  </g>

  <rect x="1" y="1" width="1598" height="898" rx="53" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
</svg>