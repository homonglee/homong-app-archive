<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <radialGradient id="edge" cx="50%" cy="50%" rx="50%">
      <stop offset="0" stop-color="white"/>
      <stop offset="42%" stop-color="white"/>
      <stop offset="76%" stop-color="#999"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="soft-edge"><rect width="1600" height="800" fill="url(#edge)"/></mask>
    <filter id="cloud" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".0035 .008" numOctaves="4" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .84  0 0 0 0 .89  0 0 0 0 .85  1.4 1.4 1.4 0 -1.25"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g mask="url(#soft-edge)"><rect width="1600" height="800" filter="url(#cloud)"/></g>
</svg>
