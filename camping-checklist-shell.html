  <style>
    html, body { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #f7f7f4; display: flex; flex-direction: column; }
    #shellToolbar {
      box-sizing: border-box; flex: 0 0 58px; width: 100%; display: flex; align-items: center; justify-content: flex-end;
      padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
      background: #0d1020; border-bottom: 1px solid rgba(255,255,255,.12); position: relative; z-index: 2;
    }
    iframe { display: block; flex: 1 1 auto; min-height: 0; height: auto; width: 100%; margin: 0; border: 0; }
    #status { position: fixed; inset: 58px 0 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 600 15px/1.5 system-ui, sans-serif; color: #3d3d39; }
    #manualLink {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 15px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
      background: linear-gradient(135deg, #7547df, #089bb8); color: #fff; text-decoration: none;
      font: 900 13px/1 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      box-shadow: 0 6px 18px rgba(7,9,20,.3); transition: transform .18s ease, filter .18s ease;
    }
    #manualLink:hover { transform: translateY(-1px); filter: brightness(1.08); }
    #manualLink:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    @media (max-width: 480px) {
      #shellToolbar { flex-basis: 52px; padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); }
      #status { inset: 52px 0 0; }
      #manualLink { min-height: 36px; padding: 0 11px; font-size: 12px; }
    }
    @media print { #shellToolbar { display: none; } }
  </style>
</head>
<body>
  <header id="shellToolbar" aria-label="앱 도구 모음">
    <a id="manualLink" href="#" aria-label="현재 앱 사용설명서 열기">📖 사용설명서</a>
  </header>
  <div id="status">앱을 불러오는 중입니다…</div>
  <script>
    (async () => {
      const slug = location.pathname.split('/').filter(Boolean)[0];
      const status = document.getElementById('status');
      const manualLink = document.getElementById('manualLink');
      manualLink.href = `/manuals/${encodeURIComponent(slug)}.html`;
      try {
        const response = await fetch('/api/app_targets', { cache: 'no-store' });
        if (!response.ok) throw new Error('app target lookup failed');
        const targets = await response.json();
        const target = targets[slug];
        if (!target || !(target.startsWith('https://') || target.startsWith('/apps/'))) throw new Error('app unavailable');

        document.title = `${slug} | Homong App`;
        const frame = document.createElement('iframe');
        frame.title = `${slug} 앱`;
        frame.src = target;
        frame.allow = 'clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen';
        frame.setAttribute('allowfullscreen', '');
        frame.addEventListener('load', () => status.remove(), { once: true });
        document.body.appendChild(frame);
      } catch (error) {
        status.textContent = '앱을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
        console.error(error);
      }
    })();
  </script>
</body>
