<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Homong App</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #f7f7f4; }
    iframe { display: block; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 600 15px/1.5 system-ui, sans-serif; color: #3d3d39; }
    #manualLink {
      position: fixed; z-index: 2147483647; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
      display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 15px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
      background: linear-gradient(135deg, #7547df, #089bb8); color: #fff; text-decoration: none;
      font: 900 13px/1 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      box-shadow: 0 10px 28px rgba(7,9,20,.34); transition: transform .18s ease, filter .18s ease;
    }
    #manualLink:hover { transform: translateY(-1px); filter: brightness(1.08); }
    #manualLink:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    @media (max-width: 480px) {
      #manualLink { top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); min-height: 40px; padding: 0 12px; font-size: 12px; }
    }
    @media print { #manualLink { display: none; } }
  </style>
</head>
<body>
  <div id="status">앱을 불러오는 중입니다…</div>
  <a id="manualLink" href="#" aria-label="현재 앱 사용설명서 열기">📖 사용설명서</a>
  <script>
    (async () => {
      const slug = location.pathname.split('/').filter(Boolean)[0];
      const status = document.getElementById('status');
      const manualLink = document.getElementById('manualLink');
      manualLink.href = `/manuals/${encodeURIComponent(slug)}.html`;
      try {
        const response = await fetch('/api/app_targets', { cache: 'no-store' });
        if (!response.ok) throw new Error('app target lookup failed');
        const targets = await response.json();
        const target = targets[slug];
        if (!target || !(target.startsWith('https://') || target.startsWith('/apps/'))) throw new Error('app unavailable');

        document.title = `${slug} | Homong App`;
        const frame = document.createElement('iframe');
        frame.title = `${slug} 앱`;
        frame.src = target;
        frame.allow = 'clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen';
        frame.setAttribute('allowfullscreen', '');
        frame.addEventListener('load', () => status.remove(), { once: true });
        document.body.appendChild(frame);
      } catch (error) {
        status.textContent = '앱을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
