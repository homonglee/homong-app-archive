<!doctype html>
<html lang="ko" data-theme="dark"><head>

  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#292042,transparent 70%),#0d1221;color:#edf4ff;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}#shellToolbar{display:flex;padding:12px max(18px,env(safe-area-inset-right));border-bottom:1px solid #ffffff20;background:#101728}main{width:min(650px,calc(100% - 36px));margin:clamp(40px,12vh,130px) auto}.launch-card{padding:clamp(24px,5vw,44px);border:1px solid #ffffff22;border-radius:28px;background:#ffffff09;box-shadow:0 20px 70px #0002}.kicker{font-size:11px;letter-spacing:.16em;color:#9ac7dc;font-weight:800}h1{font-size:clamp(24px,5vw,36px);line-height:1.45;margin:18px 0}p{color:#b1bed2;line-height:1.85;font-size:15px}.open-original{display:inline-flex;margin:18px 0;padding:15px 22px;border-radius:999px;background:linear-gradient(120deg,#7551cd,#147c97);color:#fff;text-decoration:none;font-weight:800}.open-original[hidden]{display:none}.site-origin{overflow-wrap:anywhere;font-size:12px;color:#9ac7dc}.explanation{border-top:1px solid #ffffff20;padding-top:20px;font-size:13px}.retry{padding:10px 16px;border:1px solid #ffffff40;border-radius:12px;background:transparent;color:inherit;cursor:pointer}[data-theme=light] body{background:radial-gradient(ellipse at 0 0,#eee8f8,transparent 70%),#f4f7fb;color:#24354e}[data-theme=light] .launch-card{background:#ffffffd9;border-color:#d4dfed;box-shadow:0 18px 55px #263b5c0c}[data-theme=light] p{color:#54657d}[data-theme=light] .kicker,[data-theme=light] .site-origin{color:#2f6e84}[data-theme=light] .explanation{border-color:#d5dfeb}[data-theme=light] .retry{border-color:#b3c8dc}a:focus-visible,button:focus-visible{outline:3px solid #59b7d2;outline-offset:4px}
  </style><link rel="stylesheet" href="/assets/archive-app-navigation.css">

  <header id="shellToolbar" aria-label="앱 도구 모음"><a id="archiveHomeLink" href="https://homong-app.com/" target="_top" aria-label="아카이브 홈으로 돌아가기">← 아카이브 홈</a></header>
  <main><section class="launch-card" aria-labelledby="launchName"><span class="kicker">HOMONG'S APP ARCHIVE</span><h1 id="launchName">사이트를 준비하고 있습니다</h1><p id="launchDescription" role="status">연결 정보를 확인하고 있습니다.</p><a id="openOriginal" class="open-original" target="_blank" rel="noopener noreferrer" hidden>원본 사이트 새 탭에서 열기 ↗</a><div id="siteOrigin" class="site-origin"></div><p class="explanation">원본 사이트는 새 탭에서 열립니다. 사용 후 새 탭을 닫으면 이 화면으로 돌아오며, 위의 ‘아카이브 홈’ 버튼으로 앱 목록에 복귀할 수 있습니다.</p><button id="retryLaunch" class="retry" type="button" hidden>다시 불러오기</button></section></main>
